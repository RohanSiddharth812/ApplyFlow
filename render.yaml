databases:
  - name: applyflow-db
    databaseName: applyflow
    region: singapore
    plan: free

services:
  - type: web
    name: applyflow-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://applyflow-api-51ko.onrender.com/api

  - type: web
    name: applyflow-api
    runtime: python
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: applyflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: '["https://applyflow-web-51ko.onrender.com", "http://localhost:5173", "http://localhost:3000", "http://127.0.0.1:5173", "http://127.0.0.1:3000"]'
      - key: USE_MOCK_AI
        value: "true"
      - key: USE_MOCK_JOBS
        value: "true"
