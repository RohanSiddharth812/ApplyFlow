databases:
  - name: applyflow-db
    databaseName: applyflow
    region: singapore
    plan: free

services:
  - type: web
    name: applyflow-api
    runtime: python
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: applyflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: USE_MOCK_AI
        value: "true"
      - key: USE_MOCK_JOBS
        value: "true"
